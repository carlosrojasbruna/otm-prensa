# Tramo B del ciclo (devops, fase 5): evaluada -> revisada -> simulador (6 corridas) -> redactor ->
# ilustrador -> verificador -> verificada (bibliotecario en dry-run). Se detiene en `verificada`:
# `publicada` exige la revisión humana 2 y no se hace desde acá.
#
# SOLO MANUAL. workflow_dispatch con `revisor` OBLIGATORIO: es quien hizo la revisión humana 1 de esos
# expedientes (GOB01 §2); el ciclo nunca inventa un revisor. No tiene cron ni se dispara por push.
#
# SOLO SI EXISTEN LOS SECRETS SIM_REPO Y SIM_REPO_TOKEN. El simulador (sim.py) vive en un repo externo del
# equipo (decisiones.md, fase 5: no se sube a este repo público). SIM_REPO = "dueño/repo" cuya raíz es la
# carpeta `IDEA MODELAMIENTO/` (contiene `simulacion/sim.py` e `insumos/`); SIM_REPO_TOKEN = token fino de
# solo lectura (contents:read) sobre ese repo. Si falta alguno, el workflow termina con un aviso y no hace nada.
#
# Comparte el grupo de concurrencia `semanal` con semanal.yml: ambos escriben pipeline/state/gasto_semanal.json.
name: tramo_b

on:
  workflow_dispatch:
    inputs:
      revisor:
        description: "Nombre de quien hizo la revisión humana 1 de estos expedientes (obligatorio)"
        required: true
        type: string
      ids:
        description: "Ids de expediente (tarea_id) separados por espacio; deben estar en `evaluada` y en main"
        required: true
        type: string
      presupuesto_ciclo:
        description: "Tope adicional en USD solo para este ciclo (vacío = 90 % del tope semanal)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: semanal
  cancel-in-progress: false

jobs:
  guardia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      habilitado: ${{ steps.g.outputs.habilitado }}
    env:
      SIM_REPO: ${{ secrets.SIM_REPO }}
      SIM_REPO_TOKEN: ${{ secrets.SIM_REPO_TOKEN }}
    steps:
      - id: g
        run: |
          if [ -n "$SIM_REPO" ] && [ -n "$SIM_REPO_TOKEN" ]; then
            echo "habilitado=true" >> "$GITHUB_OUTPUT"
          else
            echo "habilitado=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Tramo B deshabilitado::Faltan los secrets SIM_REPO y/o SIM_REPO_TOKEN (el simulador es un repo externo). No se hizo nada. Ver docs/secrets.md."
          fi

  tramo_b:
    needs: guardia
    if: ${{ needs.guardia.outputs.habilitado == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      IN_REVISOR: ${{ github.event.inputs.revisor }}
      IN_IDS: ${{ github.event.inputs.ids }}
      IN_PRESUPUESTO: ${{ github.event.inputs.presupuesto_ciclo }}
      PYTHONUTF8: "1"
    steps:
      - name: Comprobar secrets y entradas (no se imprimen)
        run: |
          faltan=""
          [ -n "$ANTHROPIC_API_KEY" ] || faltan="$faltan ANTHROPIC_API_KEY"
          [ -n "$GH_TOKEN" ] || faltan="$faltan GH_TOKEN"
          if [ -n "$faltan" ]; then
            echo "::error title=Faltan secrets::Crear en Settings > Secrets and variables > Actions:$faltan (ver docs/secrets.md)"
            exit 1
          fi
          [ "${#IN_REVISOR}" -ge 3 ] || { echo "::error::El input revisor es obligatorio (nombre y apellido de quien hizo la revisión humana 1)"; exit 1; }
          [[ "$IN_IDS" =~ ^[A-Za-z0-9._\ -]+$ ]] || { echo "::error::ids: solo letras, números, punto, guion y espacios"; exit 1; }
          if [ -n "$IN_PRESUPUESTO" ]; then
            [[ "$IN_PRESUPUESTO" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::presupuesto_ciclo debe ser un número en USD"; exit 1; }
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Simulador externo (repo de IDEA MODELAMIENTO)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SIM_REPO }}
          token: ${{ secrets.SIM_REPO_TOKEN }}
          path: _sim
          persist-credentials: false

      - name: Ubicar el simulador donde lo espera pipeline/config.yaml (simulador.repo)
        run: |
          destino="$(cd .. && cd .. && pwd)/IDEA MODELAMIENTO"
          ln -s "$PWD/_sim" "$destino"
          test -f "$destino/simulacion/sim.py" || { echo "::error::SIM_REPO no contiene simulacion/sim.py en su raíz"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Rama y gasto conservador
        id: rama
        run: |
          set -euo pipefail
          semana="$(date -u +%G-W%V)"
          rama="semanal/$semana"
          git config user.name "otm-prensa-bot"
          git config user.email "otm-prensa-bot@users.noreply.github.com"
          git fetch origin main
          git show origin/main:pipeline/state/gasto_semanal.json > "$RUNNER_TEMP/gasto_main.json"
          if git ls-remote --exit-code --heads origin "$rama" >/dev/null 2>&1; then
            git fetch origin "$rama"
            git checkout -B "$rama" "origin/$rama"
            git merge --no-edit -X ours origin/main
          else
            git checkout -B "$rama" origin/main
          fi
          python -m pipeline.gasto_ramas pipeline/state/gasto_semanal.json "$RUNNER_TEMP/gasto_main.json"
          echo "semana=$semana" >> "$GITHUB_OUTPUT"
          echo "rama=$rama" >> "$GITHUB_OUTPUT"

      - name: Tramo B (hasta `verificada`)
        id: ciclo
        run: |
          set +e
          read -r -a ids <<< "$IN_IDS"
          args=(--continuar "${ids[@]}" --revisor "$IN_REVISOR")
          [ -z "$IN_PRESUPUESTO" ] || args+=(--presupuesto-ciclo "$IN_PRESUPUESTO")
          python -m pipeline.ciclo "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/resumen.txt"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Invariantes sobre lo que se va a commitear
        id: invariantes
        run: |
          git add pipeline/state
          if python .claude/hooks/otm_hook.py staged; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            git reset -q
            git add pipeline/state/gasto_semanal.json pipeline/state/ciclos
          fi

      - name: Commit, push y PR
        env:
          SEMANA: ${{ steps.rama.outputs.semana }}
          RAMA: ${{ steps.rama.outputs.rama }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! git diff --cached --quiet; then
            git commit -q -m "pipeline: tramo B de $IN_IDS (revisor: $IN_REVISOR, workflow)"
            git push origin "$RAMA"
          fi
          {
            echo "Tramo B ($SEMANA): $IN_IDS. Revisión humana 1 por **$IN_REVISOR**. Ejecución: $URL_RUN"
            echo
            echo '```'
            cat "$RUNNER_TEMP/resumen.txt"
            echo '```'
            echo
            echo "Los expedientes quedan en \`verificada\`, pendientes de la revisión humana 2 de la guía. Nada se publica desde este workflow."
          } > "$RUNNER_TEMP/cuerpo.md"
          n="$(gh pr list --head "$RAMA" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$n" ]; then
            gh pr create --base main --head "$RAMA" --title "Ciclo semanal $SEMANA (tramo B)" --body-file "$RUNNER_TEMP/cuerpo.md"
          else
            gh pr comment "$n" --body-file "$RUNNER_TEMP/cuerpo.md"
          fi

      - name: Resultado
        env:
          RC: ${{ steps.ciclo.outputs.rc }}
          INV_OK: ${{ steps.invariantes.outputs.ok }}
        run: |
          if [ "$RC" = "3" ]; then echo "::warning title=Tope de gasto::El ciclo se detuvo al 90 % del tope.";
          elif [ "$RC" != "0" ]; then echo "::error::pipeline.ciclo terminó con código $RC"; exit 1; fi
          [ "$INV_OK" = "true" ] || { echo "::error::Invariantes violadas en el estado generado"; exit 1; }
