# Ciclo semanal de OTM-Prensa (devops, fase 5; GOB01 §3: lunes 06:00 Chile, 2-3 tareas por ciclo).
#
# HORA. GitHub Actions programa en UTC y no entiende husos con horario de verano. Chile continental
# usa UTC-3 en horario de verano (septiembre a abril) y UTC-4 en invierno (abril a septiembre). Se fija
# 09:00 UTC = 06:00 en horario de verano chileno (el que rige cuando se escribió este archivo, octubre);
# en invierno corre a las 05:00 hora de Chile, el mismo lunes. Si Carlos prefiere las 06:00 todo el año,
# hay que cambiar el cron dos veces al año (10:00 UTC en invierno). Nota: GitHub puede retrasar los cron
# varios minutos en horas de alta carga.
#
# QUE CORRE. Solo el TRAMO A del ciclo (explorador -> filtro -> diseñador -> evaluador x3, hasta `evaluada`;
# python -m pipeline.ciclo). El tramo B exige revisor humano y el simulador externo: ver tramo_b.yml.
# Antes del ciclo, el job `medios` verifica MED01 (pipeline.verificar_medios, sin LLM, costo 0) y sube el
# informe; el job `ciclo` lo incluye en el PR (pipeline/state/medios/).
#
# RESULTADO. Se commitea pipeline/state/ en la rama `semanal/<AAAA-WW>` (semana ISO) y se abre un PR a main
# (si ya hay uno abierto para esa rama, se agrega un comentario). Quien revisa el PR hace la revisión humana 1
# (GOB01 §2) y lo mergea; nada se publica desde acá.
#
# TOPE. El ciclo para al 90 % del tope semanal (config.yaml) y, si se indica, de `presupuesto_ciclo`.
# pipeline/state/gasto_semanal.json viaja en el PR, así que main solo ve el gasto de lo YA MERGEADO. Lectura
# conservadora (decisiones.md): antes de correr, el workflow suma al archivo los ciclos de la misma semana
# que existan en la rama semanal/<semana> (PR abierto o sin mergear) y reutiliza esa rama; el tope nunca
# subestima el gasto de PRs pendientes. Si dos PRs de semanas distintas editan el mismo archivo, el conflicto
# se resuelve conservando todos los ciclos (python -m pipeline.gasto_ramas BASE OTRA).
#
# Secrets requeridos (docs/secrets.md): ANTHROPIC_API_KEY (apikey.py la lee) y GH_TOKEN (push y PR; con el
# GITHUB_TOKEN de fábrica los PR no disparan ci.yml). Se comprueban al inicio y se falla con mensaje claro.
name: semanal

on:
  schedule:
    - cron: "0 9 * * 1"     # lunes 09:00 UTC = 06:00 Chile en horario de verano (ver arriba)
  workflow_dispatch:
    inputs:
      max_tareas:
        description: "Tareas que deben llegar a `evaluada` (2-3 en operación normal)"
        type: string
        default: "3"
      presupuesto_ciclo:
        description: "Tope adicional en USD solo para este ciclo (vacío = solo el 90 % del tope semanal). Prueba: 2"
        type: string
        default: ""
      noticia_prueba:
        description: "Ruta en el repo de una noticia JSON del contrato (salta el explorador). Prueba: evals/casos/ciclo/noticia_prueba_actions.json"
        type: string
        default: ""
      ejecutar_ciclo:
        description: "false = solo verificar MED01 (sin gasto de API)"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: semanal
  cancel-in-progress: false

jobs:
  medios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install PyYAML
      - name: Verificar MED01 (robots.txt y RSS; principal y respaldo gnews). Sin LLM
        run: python -m pipeline.verificar_medios
      - uses: actions/upload-artifact@v4
        with:
          name: verificacion-medios
          path: pipeline/state/medios/
          if-no-files-found: error

  ciclo:
    needs: medios
    # `medios` puede fallar por la red sin que el ciclo deba cancelarse.
    if: ${{ !cancelled() && github.event.inputs.ejecutar_ciclo != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      IN_MAX: ${{ github.event.inputs.max_tareas }}
      IN_PRESUPUESTO: ${{ github.event.inputs.presupuesto_ciclo }}
      IN_NOTICIA: ${{ github.event.inputs.noticia_prueba }}
      PYTHONUTF8: "1"
    steps:
      - name: Comprobar secrets (no se imprimen)
        run: |
          faltan=""
          [ -n "$ANTHROPIC_API_KEY" ] || faltan="$faltan ANTHROPIC_API_KEY"
          [ -n "$GH_TOKEN" ] || faltan="$faltan GH_TOKEN"
          if [ -n "$faltan" ]; then
            echo "::error title=Faltan secrets::Crear en Settings > Secrets and variables > Actions:$faltan (ver docs/secrets.md)"
            exit 1
          fi

      - name: Validar entradas
        id: entradas
        run: |
          max="${IN_MAX:-3}"
          [[ "$max" =~ ^[1-9][0-9]?$ ]] || { echo "::error::max_tareas debe ser un entero de 1 a 99"; exit 1; }
          pres="${IN_PRESUPUESTO:-}"
          if [ -n "$pres" ]; then
            [[ "$pres" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::presupuesto_ciclo debe ser un número en USD (p. ej. 2)"; exit 1; }
          fi
          noticia="${IN_NOTICIA:-}"
          if [ -n "$noticia" ]; then
            [[ "$noticia" =~ ^[A-Za-z0-9_./-]+$ ]] && [[ "$noticia" != *..* ]] && [[ "$noticia" != /* ]] \
              || { echo "::error::noticia_prueba debe ser una ruta relativa dentro del repo"; exit 1; }
          fi
          echo "max=$max" >> "$GITHUB_OUTPUT"
          echo "presupuesto=$pres" >> "$GITHUB_OUTPUT"
          echo "noticia=$noticia" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Rama semanal (reutiliza la de la semana si existe) y gasto conservador
        id: rama
        run: |
          set -euo pipefail
          semana="$(date -u +%G-W%V)"
          rama="semanal/$semana"
          git config user.name "otm-prensa-bot"
          git config user.email "otm-prensa-bot@users.noreply.github.com"
          git fetch origin main
          git show origin/main:pipeline/state/gasto_semanal.json > "$RUNNER_TEMP/gasto_main.json"
          if git ls-remote --exit-code --heads origin "$rama" >/dev/null 2>&1; then
            git fetch origin "$rama"
            git checkout -B "$rama" "origin/$rama"
            git merge --no-edit -X ours origin/main
            echo "reutiliza=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -B "$rama" origin/main
            echo "reutiliza=false" >> "$GITHUB_OUTPUT"
          fi
          echo "semana=$semana" >> "$GITHUB_OUTPUT"
          echo "rama=$rama" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Sumar al gasto los ciclos de main que la rama aún no tiene
        run: python -m pipeline.gasto_ramas pipeline/state/gasto_semanal.json "$RUNNER_TEMP/gasto_main.json"

      - name: Informe de MED01 del job medios (va al PR)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: verificacion-medios
          path: pipeline/state/medios

      - name: Tramo A del ciclo (hasta `evaluada`)
        id: ciclo
        env:
          MAX: ${{ steps.entradas.outputs.max }}
          PRESUPUESTO: ${{ steps.entradas.outputs.presupuesto }}
          NOTICIA: ${{ steps.entradas.outputs.noticia }}
        run: |
          set +e
          args=(--max-tareas "$MAX")
          [ -z "$PRESUPUESTO" ] || args+=(--presupuesto-ciclo "$PRESUPUESTO")
          if [ -n "$NOTICIA" ]; then
            [ -f "$NOTICIA" ] || { echo "::error::No existe la noticia de prueba: $NOTICIA"; exit 1; }
            args=(--noticia "$NOTICIA" "${args[@]}")
          fi
          python -m pipeline.ciclo "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/resumen.txt"
          rc="${PIPESTATUS[0]}"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 = terminó; 3 = detenido por tope (diseñado, no es un fallo); otro = error del ciclo
          # (el cierre de emergencia ya persistió el gasto: se commitea igual y se falla al final).
          exit 0

      - name: Invariantes sobre lo que se va a commitear (reutiliza .claude/hooks)
        id: invariantes
        run: |
          git add pipeline/state
          if python .claude/hooks/otm_hook.py staged; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Invariantes::El estado generado viola invariantes; solo se commitea el gasto y el registro del ciclo."
            git reset -q
            git add pipeline/state/gasto_semanal.json pipeline/state/ciclos
          fi

      - name: Commit, push y PR
        env:
          SEMANA: ${{ steps.rama.outputs.semana }}
          RAMA: ${{ steps.rama.outputs.rama }}
          RC: ${{ steps.ciclo.outputs.rc }}
          MAX: ${{ steps.entradas.outputs.max }}
          NOTICIA: ${{ steps.entradas.outputs.noticia }}
          PRESUPUESTO: ${{ steps.entradas.outputs.presupuesto }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "Sin cambios en pipeline/state: no hay nada que commitear."
          else
            git commit -q -m "pipeline: ciclo semanal $SEMANA (tramo A, workflow)"
            git push origin "$RAMA"
          fi
          {
            echo "Ciclo semanal $SEMANA, **tramo A** (explorador, filtro, diseñador y evaluador; hasta \`evaluada\`)."
            echo
            echo "- Ejecución: $URL_RUN"
            if [ -n "$NOTICIA" ]; then echo "- Origen: noticia de prueba \`$NOTICIA\`"; else echo "- Origen: explorador sobre MED01"; fi
            echo "- max_tareas: $MAX · presupuesto_ciclo: ${PRESUPUESTO:-sin tope propio (90 % del tope semanal)}"
            if [ "$RC" = "3" ]; then echo "- **El ciclo se detuvo por el tope de gasto (90 %).** Los expedientes quedaron en su último estado válido."; fi
            if [ "$RC" != "0" ] && [ "$RC" != "3" ]; then echo "- **El ciclo terminó con error (código $RC).** Ver el log de la ejecución."; fi
            echo
            echo "Resumen del ciclo:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/resumen.txt"
            echo '```'
            echo
            echo "Revisión humana 1 (GOB01 §2): leer enunciado, recursos, nivel declarado y RUB01 de cada expediente \`evaluada\`; el tramo B (simulación y guía) se lanza después por quien revisó. Este PR no publica nada."
          } > "$RUNNER_TEMP/cuerpo.md"
          n="$(gh pr list --head "$RAMA" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$n" ]; then
            gh pr create --base main --head "$RAMA" --title "Ciclo semanal $SEMANA (tramo A)" --body-file "$RUNNER_TEMP/cuerpo.md"
          else
            gh pr comment "$n" --body-file "$RUNNER_TEMP/cuerpo.md"
          fi
          cat "$RUNNER_TEMP/cuerpo.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: resumen-ciclo
          path: ${{ runner.temp }}/resumen.txt
          if-no-files-found: ignore

      - name: Resultado
        env:
          RC: ${{ steps.ciclo.outputs.rc }}
          INV_OK: ${{ steps.invariantes.outputs.ok }}
        run: |
          if [ "$RC" = "3" ]; then
            echo "::warning title=Tope de gasto::El ciclo se detuvo al 90 % del tope semanal (o de presupuesto_ciclo)."
          elif [ "$RC" != "0" ]; then
            echo "::error title=Ciclo con error::python -m pipeline.ciclo terminó con código $RC"
            exit 1
          fi
          [ "$INV_OK" = "true" ] || { echo "::error::Invariantes violadas en el estado generado"; exit 1; }
