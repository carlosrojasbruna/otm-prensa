# Configuración del agente verificador (agente 7). El modelo sale de pipeline/config.yaml (modelos.verificador).
agente: verificador
version_prompt: "1.1"
prompt: prompt.md
esquema_salida: salida.schema.json   # local: el verificador no tiene contrato en contratos/ (decisiones.md)
# Los modelos 5.5 no aceptan temperature (pipeline/llm.py); se usa el valor por defecto.
temperature: null
esfuerzo: null
max_tokens: 8000
notebook:
  timeout_s: 60
  red: bloqueada
estado_si_aprueba: verificada
estado_si_rechaza: simulada          # hallazgo crítico solo en la guía: se rehace la guía
estado_si_rechaza_tarea: evaluada   # hallazgo crítico sobre la tarea: vuelve a la revisión humana 1 (no se archiva)
